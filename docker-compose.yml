version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: talimcrm-postgres
    environment:
      POSTGRES_DB: talimcrm_db
      POSTGRES_USER: talimcrm_user
      POSTGRES_PASSWORD: talimcrm_password_2024
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - talimcrm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talimcrm_user -d talimcrm_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Spring Boot Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talimcrm-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/talimcrm_db
      SPRING_DATASOURCE_USERNAME: talimcrm_user
      SPRING_DATASOURCE_PASSWORD: talimcrm_password_2024
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: false
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: true
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - talimcrm-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  talimcrm-network:
    driver: bridge
