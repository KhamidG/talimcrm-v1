<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details</title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>

<header class="navbar">
    <h1>Talim CRM</h1>
    <nav>
        <a href="index.html">Students</a>
        <a href="register.html">Register New</a>
    </nav>
</header>

<main class="container">
    <h2>Student Details</h2>
    <div class="details-card">
        <h3>Name: <span id="studentName"></span></h3>
        <p><strong>ID:</strong> <span id="studentId"></span></p>
        <p><strong>Status:</strong> <span id="studentStatus"></span></p>
        <p><strong>Group:</strong> <span id="studentGroup"></span></p>

    <div class="details-actions">
        <a href="index.html" class="btn back-btn">Back to List</a>
        <button class="btn delete-btn">Delete Student</button>
    </div>
</main>

</html>
