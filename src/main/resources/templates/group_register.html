<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Group</title>
    <link rel="stylesheet" th:href="@{/style.css}" />
</head>
<body>
<div class="app-container">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            Talim CRM
        </div>
        <nav class="sidebar-nav">
            <a class="nav-link" th:href="@{/v1/auth/reception}"><span>Reception</span></a>
            <a class="nav-link" th:href="@{/v1/student/listPage}"><span>Students</span></a>
            <a class="nav-link" th:href="@{/v1/student/register}"><span>New student</span></a>
            <a class="nav-link" th:href="@{/v1/group/listPage}"><span>Groups</span></a>
            <a class="nav-link" th:href="@{/v1/group/register}"><span>New group</span></a>
            <a class="nav-link" th:href="@{/v1/teacher/listPage}"><span>Teachers</span></a>
            <a class="nav-link" th:href="@{/v1/teacher/register}"><span>New teacher</span></a>
            <a class="nav-link" th:href="@{/v1/pay/listPage}"><span>Payments</span></a>
            <a class="nav-link" th:href="@{/v1/pay/createPage}"><span>New Payment</span></a>
            <a class="nav-link" th:href="@{/v1/stats/page}"><span>Statistics</span></a>
            <a class="nav-link" th:href="@{/v1/pay/monthlyStatsPage}"><span>Monthly Stats</span></a>
        </nav>
    </aside>
    <main class="main-content">
        <button class="menu-toggle btn btn-outline" id="sidebarToggle" aria-label="Toggle menu">☰</button>
<div class="container">

    <h1>Create Group</h1>

    <form id="groupRegisterForm" style="max-width:520px;">
        <div style="margin-bottom:12px;">
            <label>Name *</label>
            <input type="text" id="nameOfGroup" style="width:100%; padding:10px 14px; border:1px solid #ddd; border-radius:8px;" placeholder="Group name" required>
        </div>
        <div style="margin-bottom:12px;">
            <label>Type *</label>
            <select id="typeOfGroup" style="width:100%; padding:10px 14px; border:1px solid #ddd; border-radius:8px;" required>
                <option value="BEGINNER">Beginner</option>
                <option value="INTERMEDIATE">Intermediate</option>
                <option value="PRE_IELTS">Pre-IELTS</option>
                <option value="IELTS">IELTS</option>
                <option value="CEFR">CEFR</option>
            </select>
        </div>
        <div style="margin-bottom:12px;">
            <label>Max students</label>
            <input type="number" id="maxStudents" style="width:100%; padding:10px 14px; border:1px solid #ddd; border-radius:8px;" placeholder="30">
        </div>
        <div style="margin-bottom:12px;">
            <label>Teacher</label>
            <select id="teacherId" style="width:100%; padding:10px 14px; border:1px solid #ddd; border-radius:8px;">
                <option value="">Select teacher</option>
            </select>
        </div>
        <div style="margin-bottom:12px;">
            <label>Lesson Start Time</label>
            <input type="time" id="lessonStartTime" style="width:100%; padding:10px 14px; border:1px solid #ddd; border-radius:8px;" placeholder="16:00">
        </div>
        <div style="margin-bottom:12px;">
            <label>Lesson End Time</label>
            <input type="time" id="lessonEndTime" style="width:100%; padding:10px 14px; border:1px solid #ddd; border-radius:8px;" placeholder="18:00">
        </div>
        <div style="margin-bottom:12px;">
            <label>Lesson Days</label>
            <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px;">
                <label style="display: flex; align-items: center; gap: 4px;">
                    <input type="checkbox" value="Monday" name="lessonDays">
                    Monday
                </label>
                <label style="display: flex; align-items: center; gap: 4px;">
                    <input type="checkbox" value="Tuesday" name="lessonDays">
                    Tuesday
                </label>
                <label style="display: flex; align-items: center; gap: 4px;">
                    <input type="checkbox" value="Wednesday" name="lessonDays">
                    Wednesday
                </label>
                <label style="display: flex; align-items: center; gap: 4px;">
                    <input type="checkbox" value="Thursday" name="lessonDays">
                    Thursday
                </label>
                <label style="display: flex; align-items: center; gap: 4px;">
                    <input type="checkbox" value="Friday" name="lessonDays">
                    Friday
                </label>
                <label style="display: flex; align-items: center; gap: 4px;">
                    <input type="checkbox" value="Saturday" name="lessonDays">
                    Saturday
                </label>
                <label style="display: flex; align-items: center; gap: 4px;">
                    <input type="checkbox" value="Sunday" name="lessonDays">
                    Sunday
                </label>
            </div>
        </div>
        <div class="actions">
            <button type="submit" class="btn">Create</button>
            <a th:href="@{/v1/group/listPage}" class="btn" style="background:#e0e0e0; color:#333;">Cancel</a>
                </div>
            </form>
        </div>
    </main>
    </div>

<script>
    const API = '/v1/group';
    
    // Load teachers on page load
    document.addEventListener('DOMContentLoaded', async () => {
        try {
            const response = await fetch('/v1/teacher/list');
            if (response.ok) {
                const teachers = await response.json();
                const teacherSelect = document.getElementById('teacherId');
                teachers.forEach(teacher => {
                    const option = document.createElement('option');
                    option.value = teacher.id;
                    option.textContent = teacher.fullName;
                    teacherSelect.appendChild(option);
                });
            }
        } catch (error) {
            console.error('Failed to load teachers:', error);
        }
    });
    
    document.getElementById('groupRegisterForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        // Get selected lesson days
        const selectedDays = Array.from(document.querySelectorAll('input[name="lessonDays"]:checked'))
            .map(checkbox => checkbox.value);
        
        const payload = {
            nameOfGroup: document.getElementById('nameOfGroup').value.trim(),
            typeOfGroup: document.getElementById('typeOfGroup').value,
            maxStudents: document.getElementById('maxStudents').value ? parseInt(document.getElementById('maxStudents').value) : null,
            teacherId: document.getElementById('teacherId').value ? parseInt(document.getElementById('teacherId').value) : null,
            lessonStartTime: document.getElementById('lessonStartTime').value,
            lessonEndTime: document.getElementById('lessonEndTime').value,
            lessonDays: selectedDays.join(',')
        };
        
        const res = await fetch(`${API}/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        if (res.ok) {
            window.location.href = '/v1/group/listPage';
        } else {
            alert('Failed to create group');
        }
    });
// sidebar toggle
(() => {
  const sidebar = document.getElementById('sidebar');
  const toggle = document.getElementById('sidebarToggle');
  const key = 'talimcrm.sidebar.collapsed';
  const apply = () => {
    const collapsed = localStorage.getItem(key) === '1';
    if (collapsed) sidebar.classList.add('collapsed'); else sidebar.classList.remove('collapsed');
  };
  apply();
  toggle.addEventListener('click', () => {
    const collapsed = !(localStorage.getItem(key) === '1');
    localStorage.setItem(key, collapsed ? '1' : '0');
    apply();
  });
})();
</script>
</body>
</html>
