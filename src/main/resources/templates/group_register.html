<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Group</title>
    <link rel="stylesheet" th:href="@{/style.css}" />
</head>
<body>
<div class="app-container">
    <aside class="sidebar">
        <div class="sidebar-header">📚 Talim CRM</div>
        <nav class="sidebar-nav">
            <a class="nav-link" th:href="@{/v1/auth/reception}"><span>Reception</span></a>
            <a class="nav-link" th:href="@{/v1/student/listPage}"><span>Students</span></a>
            <a class="nav-link" th:href="@{/v1/student/register}"><span>New student</span></a>
            <a class="nav-link" th:href="@{/v1/group/listPage}"><span>Groups</span></a>
            <a class="nav-link" th:href="@{/v1/group/register}"><span>New group</span></a>
            <a class="nav-link" th:href="@{/v1/teacher/listPage}"><span>Teachers</span></a>
            <a class="nav-link" th:href="@{/v1/teacher/register}"><span>New teacher</span></a>
            <a class="nav-link" th:href="@{/v1/pay/listPage}"><span>Payments</span></a>
            <a class="nav-link" th:href="@{/v1/pay/statsPage}"><span>Stats</span></a>
        </nav>
    </aside>
    <main class="main-content">
<div class="container">

    <h1>Create Group</h1>

    <form id="groupRegisterForm" style="max-width:520px;">
        <div style="margin-bottom:12px;">
            <label>Name *</label>
            <input type="text" id="nameOfGroup" style="width:100%; padding:10px 14px; border:1px solid #ddd; border-radius:8px;" placeholder="Group name" required>
        </div>
        <div style="margin-bottom:12px;">
            <label>Type *</label>
            <select id="typeOfGroup" style="width:100%; padding:10px 14px; border:1px solid #ddd; border-radius:8px;" required>
                <option value="BEGINNER">Beginner</option>
                <option value="INTERMEDIATE">Intermediate</option>
                <option value="PRE_IELTS">Pre-IELTS</option>
                <option value="IELTS">IELTS</option>
                <option value="CEFR">CEFR</option>
            </select>
        </div>
        <div style="margin-bottom:12px;">
            <label>Max students</label>
            <input type="number" id="maxStudents" style="width:100%; padding:10px 14px; border:1px solid #ddd; border-radius:8px;" placeholder="30">
        </div>
        <div class="actions">
            <button type="submit" class="btn">Create</button>
            <a th:href="@{/v1/group/listPage}" class="btn" style="background:#e0e0e0; color:#333;">Cancel</a>
        </div>
    </form>
</div>
    </main>
</div>

<script>
    const API = '/v1/group';
    document.getElementById('groupRegisterForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
            nameOfGroup: document.getElementById('nameOfGroup').value.trim(),
            typeOfGroup: document.getElementById('typeOfGroup').value,
            maxStudents: document.getElementById('maxStudents').value ? parseInt(document.getElementById('maxStudents').value) : null
        };
        const res = await fetch(`${API}/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        if (res.ok) {
            window.location.href = '/v1/group/listPage';
        } else {
            alert('Failed to create group');
        }
    });
</script>
</body>
</html>
