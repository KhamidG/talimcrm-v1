<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groups</title>
    <link rel="stylesheet" th:href="@{/style.css}" />
</head>
<body>
<div class="app-container">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">📚 Talim CRM</div>
        <nav class="sidebar-nav">
            <a class="nav-link" th:href="@{/v1/auth/reception}"><span>Reception</span></a>
            <a class="nav-link" th:href="@{/v1/student/listPage}"><span>Students</span></a>
            <a class="nav-link" th:href="@{/v1/student/register}"><span>New student</span></a>
            <a class="nav-link" th:href="@{/v1/group/listPage}"><span>Groups</span></a>
            <a class="nav-link" th:href="@{/v1/group/register}"><span>New group</span></a>
            <a class="nav-link" th:href="@{/v1/teacher/listPage}"><span>Teachers</span></a>
            <a class="nav-link" th:href="@{/v1/teacher/register}"><span>New teacher</span></a>
            <a class="nav-link" th:href="@{/v1/pay/listPage}"><span>Payments</span></a>
            <a class="nav-link" th:href="@{/v1/pay/statsPage}"><span>Stats</span></a>
    </nav>
</aside>
    <main class="main-content">
        <button class="menu-toggle btn btn-outline" id="sidebarToggle" aria-label="Toggle menu">☰</button>
<div class="container">

    <h1>Groups</h1>

    <div class="controls" style="display:flex; gap:12px; align-items:center; margin:12px 0; flex-wrap:wrap;">
        <input id="searchInput" type="text" placeholder="Search by name or teacher" style="padding:10px 14px; border:1px solid #ddd; border-radius:8px; min-width:260px;">
        <select id="typeFilter" style="padding:10px 14px; border:1px solid #ddd; border-radius:8px;">
            <option value="">All types</option>
                <option value="BEGINNER">Beginner</option>
                <option value="INTERMEDIATE">Intermediate</option>
                <option value="PRE_IELTS">Pre-IELTS</option>
                <option value="IELTS">IELTS</option>
                <option value="CEFR">CEFR</option>
            </select>
        <select id="pageSize" style="padding:10px 14px; border:1px solid #ddd; border-radius:8px;">
            <option value="10">10 per page</option>
            <option value="25" selected>25 per page</option>
            <option value="50">50 per page</option>
            <option value="100">100 per page</option>
            </select>
        </div>

    <table class="table">
                <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Type</th>
            <th>Teacher</th>
            <th>Students</th>
            <th>Max</th>
            <th>Created</th>
            <th>Actions</th>
                </tr>
                </thead>
        <tbody id="groupsTableBody">
            <!-- Groups will be loaded here -->
        </tbody>
            </table>
            
        <!-- Pagination Controls -->
        <div id="paginationControls" style="display:flex; justify-content:space-between; align-items:center; margin:20px 0; padding:10px 0;">
            <div id="paginationInfo" style="color:#666; font-size:14px;">
                Showing <span id="showingStart">0</span> to <span id="showingEnd">0</span> of <span id="totalRecords">0</span> entries
            </div>
            <div id="paginationButtons" style="display:flex; gap:8px;">
                <button id="prevPage" class="btn btn-outline" style="padding:8px 12px; border:1px solid #ddd; background:white; border-radius:6px; cursor:pointer;" disabled>Previous</button>
                <div id="pageNumbers" style="display:flex; gap:4px;"></div>
                <button id="nextPage" class="btn btn-outline" style="padding:8px 12px; border:1px solid #ddd; background:white; border-radius:6px; cursor:pointer;" disabled>Next</button>
            </div>
        </div>
</div>
    </main>
</div>
<!-- Assign Teacher Modal -->
<div id="assignTeacherModal" class="modal" style="display:none; position:fixed; left:0; top:0; right:0; bottom:0; background:rgba(0,0,0,.4); align-items:center; justify-content:center;">
    <div class="modal-content" style="background:#fff; border-radius:12px; padding:20px; width:90%; max-width:420px; position:relative; z-index:1;">
        <h3 style="margin-top:0;">Assign teacher to group</h3>
        <div style="margin:12px 0;">
            <label>Teacher</label>
            <select id="assignTeacherSelect" style="width:100%; padding:10px 14px; border:1px solid #ddd; border-radius:8px;"></select>
        </div>
        <div class="actions" style="justify-content:flex-end;">
            <button class="action-btn" type="button" style="background:#ccc;" onclick="closeAssignTeacherModal()">Cancel</button>
            <button class="action-btn edit-btn" type="button" onclick="confirmAssignTeacher()">Assign</button>
        </div>
        <input type="hidden" id="assignTeacherGroupId" />
    </div>
    <div onclick="closeAssignTeacherModal()" style="position:absolute; inset:0;"></div>
            </div>

<!-- Add Student Modal -->
<div id="addStudentModal" class="modal" style="display:none; position:fixed; left:0; top:0; right:0; bottom:0; background:rgba(0,0,0,.4); align-items:center; justify-content:center;">
    <div class="modal-content" style="background:#fff; border-radius:12px; padding:20px; width:90%; max-width:420px; position:relative; z-index:1;">
        <h3 style="margin-top:0;">Add student to group</h3>
        <div style="margin:12px 0;">
            <label>Student</label>
            <select id="addStudentSelect" style="width:100%; padding:10px 14px; border:1px solid #ddd; border-radius:8px;"></select>
                </div>
        <div class="actions" style="justify-content:flex-end;">
            <button class="action-btn" type="button" style="background:#ccc;" onclick="closeAddStudentModal()">Cancel</button>
            <button class="action-btn edit-btn" type="button" onclick="confirmAddStudent()">Add</button>
        </div>
        <input type="hidden" id="addStudentGroupId" />
    </div>
    <div onclick="closeAddStudentModal()" style="position:absolute; inset:0;"></div>
</div>

<script>
    const API_BASE = '/v1/group';
    let groups = [];
    let teachersCache = [];
    let studentsCache = [];
    let currentPage = 1;
    let pageSize = 25;
    let filteredData = [];

    document.addEventListener('DOMContentLoaded', () => {
        loadGroups();
        document.getElementById('searchInput').addEventListener('input', applyFilters);
        document.getElementById('typeFilter').addEventListener('change', applyFilters);
        document.getElementById('pageSize').addEventListener('change', (e) => {
            pageSize = parseInt(e.target.value);
            currentPage = 1;
            applyFilters();
        });
        document.getElementById('prevPage').addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                renderPage();
            }
        });
        document.getElementById('nextPage').addEventListener('click', () => {
            const totalPages = Math.ceil(filteredData.length / pageSize);
            if (currentPage < totalPages) {
                currentPage++;
                renderPage();
            }
        });
    });

    async function loadGroups() {
        try {
            const res = await fetch(`${API_BASE}/list`);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            groups = await res.json();
            applyFilters();
        } catch (e) {
            console.error('Failed to load groups', e);
        }
    }

    function applyFilters() {
        const term = document.getElementById('searchInput').value.toLowerCase().trim();
        const type = document.getElementById('typeFilter').value;
        let data = groups.slice();
        if (term) {
            data = data.filter(g => 
                (g.nameOfGroup || '').toLowerCase().includes(term) || 
                (g.teacherFullName || '').toLowerCase().includes(term)
            );
        }
        if (type) {
            data = data.filter(g => g.typeOfGroup === type);
        }
        filteredData = data;
        currentPage = 1;
        renderPage();
    }

    function renderPage() {
        const startIndex = (currentPage - 1) * pageSize;
        const endIndex = startIndex + pageSize;
        const pageData = filteredData.slice(startIndex, endIndex);
        
        const tbody = document.getElementById('groupsTableBody');
        tbody.innerHTML = '';
        if (!pageData || pageData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding:20px; color:#888;">No groups found</td></tr>`;
        } else {
            pageData.forEach(g => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${g.id}</td>
                    <td>${escapeHtml(g.nameOfGroup || '—')}</td>
                    <td>${escapeHtml(g.typeOfGroup || '—')}</td>
                    <td>${escapeHtml(g.teacherFullName || '—')}</td>
                    <td>${g.currentStudents || 0}</td>
                    <td>${g.maxStudents || '—'}</td>
                    <td>${escapeHtml(g.created_at || '—')}</td>
                    <td>
                        <div class="actions">
                            <button class="action-btn edit-btn" type="button" data-group-id="${g.id}" onclick="openAssignTeacherModal(this)">Assign teacher</button>
                            <button class="action-btn" type="button" style="background:#6c757d;color:#fff;" data-group-id="${g.id}" onclick="openAddStudentModal(this)">Add student</button>
                        </div>
                </td>
            `;
                tbody.appendChild(tr);
            });
        }
        updatePagination();
    }

    function updatePagination() {
        const totalPages = Math.ceil(filteredData.length / pageSize);
        const startIndex = (currentPage - 1) * pageSize;
        const endIndex = Math.min(startIndex + pageSize, filteredData.length);
        
        // Update pagination info
        document.getElementById('showingStart').textContent = filteredData.length > 0 ? startIndex + 1 : 0;
        document.getElementById('showingEnd').textContent = endIndex;
        document.getElementById('totalRecords').textContent = filteredData.length;
        
        // Update buttons
        document.getElementById('prevPage').disabled = currentPage <= 1;
        document.getElementById('nextPage').disabled = currentPage >= totalPages;
        
        // Update page numbers
        const pageNumbersDiv = document.getElementById('pageNumbers');
        pageNumbersDiv.innerHTML = '';
        
        const maxVisiblePages = 5;
        let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
        let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);
        
        if (endPage - startPage + 1 < maxVisiblePages) {
            startPage = Math.max(1, endPage - maxVisiblePages + 1);
        }
        
        for (let i = startPage; i <= endPage; i++) {
            const pageBtn = document.createElement('button');
            pageBtn.textContent = i;
            pageBtn.className = i === currentPage ? 'btn btn-primary' : 'btn btn-outline';
            pageBtn.style.cssText = 'padding:8px 12px; border:1px solid #ddd; background:' + (i === currentPage ? '#007bff; color:white' : 'white') + '; border-radius:6px; cursor:pointer;';
            pageBtn.addEventListener('click', () => {
                currentPage = i;
                renderPage();
            });
            pageNumbersDiv.appendChild(pageBtn);
        }
    }

    async function openAssignTeacherModal(btn){
        const groupId = btn.getAttribute('data-group-id');
        document.getElementById('assignTeacherGroupId').value = groupId;
        const modal = document.getElementById('assignTeacherModal');
        modal.style.display = 'flex';
        try {
            if (teachersCache.length === 0) {
                const res = await fetch('/v1/teacher/list');
                if (!res.ok) throw new Error('Teacher list failed');
                teachersCache = await res.json();
            }
            const sel = document.getElementById('assignTeacherSelect');
            sel.innerHTML = teachersCache.map(t => `<option value="${t.id}">${escapeHtml(t.fullName)||'—'} (${escapeHtml(t.phoneNum)||''})</option>`).join('');
        } catch(e){ alert('Failed to load teachers'); }
    }
    function closeAssignTeacherModal(){ document.getElementById('assignTeacherModal').style.display='none'; }
    async function confirmAssignTeacher(){
        const groupId = document.getElementById('assignTeacherGroupId').value;
        const teacherId = document.getElementById('assignTeacherSelect').value;
        try{
            const res = await fetch(`/v1/group/assignTeacher/${groupId}/${teacherId}`, { method:'POST' });
            if (!res.ok) throw new Error(await res.text());
            closeAssignTeacherModal();
            loadGroups(); // Reload groups instead of full page reload
        }catch(e){ alert(e.message || 'Failed to assign teacher'); }
    }

    async function openAddStudentModal(btn){
        const groupId = btn.getAttribute('data-group-id');
        document.getElementById('addStudentGroupId').value = groupId;
        const modal = document.getElementById('addStudentModal');
        modal.style.display = 'flex';
        try {
            if (studentsCache.length === 0) {
                const res = await fetch('/v1/student/list');
                if (!res.ok) throw new Error('Student list failed');
                studentsCache = await res.json();
            }
            const sel = document.getElementById('addStudentSelect');
            sel.innerHTML = studentsCache.map(s => `<option value="${s.id}">${escapeHtml(s.fullName)||'—'} (${escapeHtml(s.phoneNum)||''})</option>`).join('');
        } catch(e){ alert('Failed to load students'); }
    }
    function closeAddStudentModal(){ document.getElementById('addStudentModal').style.display='none'; }
    async function confirmAddStudent(){
        const groupId = document.getElementById('addStudentGroupId').value;
        const studentId = document.getElementById('addStudentSelect').value;
        try{
            const res = await fetch(`/v1/student/addToGroup/${studentId}/${groupId}`, { method:'POST' });
            if (!res.ok) throw new Error(await res.text());
            closeAddStudentModal();
            loadGroups(); // Reload groups instead of full page reload
        }catch(e){ alert(e.message || 'Failed to add student'); }
    }

    function escapeHtml(s){ if(s==null) return ''; return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c])); }
// sidebar toggle
(() => {
  const sidebar = document.getElementById('sidebar');
  const toggle = document.getElementById('sidebarToggle');
  const key = 'talimcrm.sidebar.collapsed';
  const apply = () => {
    const collapsed = localStorage.getItem(key) === '1';
    if (collapsed) sidebar.classList.add('collapsed'); else sidebar.classList.remove('collapsed');
  };
  apply();
  toggle.addEventListener('click', () => {
    const collapsed = !(localStorage.getItem(key) === '1');
    localStorage.setItem(key, collapsed ? '1' : '0');
    apply();
  });
})();
</script>
</body>
</html>
