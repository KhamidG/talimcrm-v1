<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM: Список учеников</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>

<header class="header">
    <div class="header-container">
        <h1 class="logo">CRM</h1>
        <nav class="navigation">
            <a href="#" class="nav-link active">Ученики</a>
            <a href="#" class="nav-link">Группы</a>
        </nav>
    </div>
</header>

<main class="main-content">
    <div class="container">
        <div class="dashboard-header">
            <h2 class="page-title">Список учеников</h2>
            <button class="add-button">
                + Добавить ученика
            </button>
        </div>

        <div class="controls-panel">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Поиск по имени...">
            </div>
            <div class="filter-panel">
                <label for="statusFilter" class="filter-label">Статус:</label>
                <select id="statusFilter" class="filter-select">
                    <option value="">Все</option>
                    <option value="ACTIVE">Активный</option>
                    <option value="PROSPECT">Кандидат</option>
                    <option value="INACTIVE">Неактивный</option>
                </select>
            </div>
        </div>

        <div class="table-container">
            <table class="students-table">
                <thead>
                <tr>
                    <th>Имя</th>
                    <th>Статус</th>
                    <th>Группа</th>
                    <th>Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <td>Иван Иванов</td>
                    <td>Активный</td>
                    <td>Группа 1</td>
                    <td class="actions">
                        <button class="action-btn edit-btn">Изменить</button>
                        <button class="action-btn delete-btn">Удалить</button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

</body>
</html>
