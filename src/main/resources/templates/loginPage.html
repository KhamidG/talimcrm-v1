<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unified Login</title>
    <link rel="stylesheet" th:href="@{/styles.css}"> </head>
<body>

<div class="login-container">
    <h1>Welcome Back</h1>

    <div class="role-selector">
        <button id="teacher-btn" class="active">Teacher Login</button>
        <button id="admin-btn">Admin Login</button>
    </div>

    <form id="login-form">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>

        <input type="hidden" id="role-input" name="role" value="teacher">

        <button type="submit" id="submit-btn">Log In as Teacher</button>
    </form>

    <p class="role-hint">Logging in as <span id="current-role">Teacher</span>.</p>
</div>

<script src="script.js"></script> </body>
</html>
