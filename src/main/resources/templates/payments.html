<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payments</title>
    <link rel="stylesheet" th:href="@{/style.css}" />
</head>
<body>
<div class="app-container">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            Talim CRM
        </div>
        <nav class="sidebar-nav">
            <a class="nav-link" th:href="@{/v1/auth/reception}"><span>Reception</span></a>
            <a class="nav-link" th:href="@{/v1/student/listPage}"><span>Students</span></a>
            <a class="nav-link" th:href="@{/v1/student/register}"><span>New student</span></a>
            <a class="nav-link" th:href="@{/v1/group/listPage}"><span>Groups</span></a>
            <a class="nav-link" th:href="@{/v1/group/register}"><span>New group</span></a>
            <a class="nav-link" th:href="@{/v1/teacher/listPage}"><span>Teachers</span></a>
            <a class="nav-link" th:href="@{/v1/teacher/register}"><span>New teacher</span></a>
            <a class="nav-link" th:href="@{/v1/pay/listPage}"><span>Payments</span></a>
            <a class="nav-link" th:href="@{/v1/pay/createPage}"><span>New Payment</span></a>
            <a class="nav-link" th:href="@{/v1/stats/page}"><span>Statistics</span></a>
            <a class="nav-link" th:href="@{/v1/pay/monthlyStatsPage}"><span>Monthly Stats</span></a>
        </nav>
    </aside>
    <main class="main-content">
<div class="container">

    <h1>Payments</h1>

    <div class="controls" style="display:flex; gap:12px; align-items:center; margin:12px 0; flex-wrap:wrap;">
        <input id="searchInput" type="text" placeholder="Search by student id or group id" style="padding:10px 14px; border:1px solid #ddd; border-radius:8px; min-width:260px;">
        <select id="typeFilter" style="padding:10px 14px; border:1px solid #ddd; border-radius:8px;">
            <option value="">All types</option>
            <option value="CASH">CASH</option>
            <option value="CARD">CARD</option>
        </select>
        <select id="pageSize" style="padding:10px 14px; border:1px solid #ddd; border-radius:8px;">
            <option value="10">10 per page</option>
            <option value="25" selected>25 per page</option>
            <option value="50">50 per page</option>
            <option value="100">100 per page</option>
        </select>
    </div>

    <table class="table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Student ID</th>
            <th>Group ID</th>
            <th>Amount</th>
            <th>Type</th>
            <th>Status</th>
            <th>Created</th>
        </tr>
        </thead>
        <tbody id="paymentsTableBody">
        <tr th:each="p : ${payments}">
            <td th:text="${p.id}">1</td>
            <td th:text="${p.student}">10</td>
            <td th:text="${p.groupId}">5</td>
            <td th:text="${p.sum}">100000</td>
            <td th:text="${p.paymentType}">CASH</td>
            <td th:text="${p.paymentStatus}">PAID</td>
            <td th:text="${p.created_at}">2025-01-01</td>
        </tr>
        <tr th:if="${#lists.isEmpty(payments)}">
            <td colspan="7" style="text-align:center; padding:20px; color:#888;">No payments</td>
        </tr>
        </tbody>
    </table>
    
    <!-- Pagination Controls -->
    <div id="paginationControls" style="display:flex; justify-content:space-between; align-items:center; margin:20px 0; padding:10px 0;">
        <div id="paginationInfo" style="color:#666; font-size:14px;">
            Showing <span id="showingStart">0</span> to <span id="showingEnd">0</span> of <span id="totalRecords">0</span> entries
        </div>
        <div id="paginationButtons" style="display:flex; gap:8px;">
            <button id="prevPage" class="btn btn-outline" style="padding:8px 12px; border:1px solid #ddd; background:white; border-radius:6px; cursor:pointer;" disabled>Previous</button>
            <div id="pageNumbers" style="display:flex; gap:4px;"></div>
            <button id="nextPage" class="btn btn-outline" style="padding:8px 12px; border:1px solid #ddd; background:white; border-radius:6px; cursor:pointer;" disabled>Next</button>
        </div>
    </div>
</div>
    </main>
</div>

<script>
    let payments = [];
    let currentPage = 1;
    let pageSize = 25;
    let filteredData = [];
    
    document.addEventListener('DOMContentLoaded', () => {
        const srch = document.getElementById('searchInput');
        const type = document.getElementById('typeFilter');
        const pageSizeSelect = document.getElementById('pageSize');
        
        srch && srch.addEventListener('input', applyFilters);
        type && type.addEventListener('change', applyFilters);
        pageSizeSelect && pageSizeSelect.addEventListener('change', (e) => {
            pageSize = parseInt(e.target.value);
            currentPage = 1;
            applyFilters();
        });
        
        document.getElementById('prevPage').addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                renderPage();
            }
        });
        document.getElementById('nextPage').addEventListener('click', () => {
            const totalPages = Math.ceil(filteredData.length / pageSize);
            if (currentPage < totalPages) {
                currentPage++;
                renderPage();
            }
        });
    });
    
    function applyFilters(){
        const term = (document.getElementById('searchInput').value||'').toLowerCase().trim();
        const type = document.getElementById('typeFilter').value;
        if (!Array.isArray(payments) || payments.length === 0) return;
        
        const data = payments.filter(p => {
            const matchesTerm = !term || String(p.student||'').includes(term) || String(p.groupId||'').includes(term);
            const matchesType = !type || p.paymentType === type;
            return matchesTerm && matchesType;
        });
        
        filteredData = data;
        currentPage = 1;
        renderPage();
    }
    
    function renderPage() {
        const startIndex = (currentPage - 1) * pageSize;
        const endIndex = startIndex + pageSize;
        const pageData = filteredData.slice(startIndex, endIndex);
        
        const tbody = document.getElementById('paymentsTableBody');
        tbody.innerHTML = '';
        if (pageData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:20px; color:#888;">No payments</td></tr>`;
        } else {
            pageData.forEach(p => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${p.id}</td>
                    <td>${p.student}</td>
                    <td>${p.groupId}</td>
                    <td>${p.sum}</td>
                    <td>${p.paymentType}</td>
                    <td>${p.paymentStatus}</td>
                    <td>${p.created_at}</td>
                `;
                tbody.appendChild(tr);
            });
        }
        updatePagination();
    }
    
    function updatePagination() {
        const totalPages = Math.ceil(filteredData.length / pageSize);
        const startIndex = (currentPage - 1) * pageSize;
        const endIndex = Math.min(startIndex + pageSize, filteredData.length);
        
        // Update pagination info
        document.getElementById('showingStart').textContent = filteredData.length > 0 ? startIndex + 1 : 0;
        document.getElementById('showingEnd').textContent = endIndex;
        document.getElementById('totalRecords').textContent = filteredData.length;
        
        // Update buttons
        document.getElementById('prevPage').disabled = currentPage <= 1;
        document.getElementById('nextPage').disabled = currentPage >= totalPages;
        
        // Update page numbers
        const pageNumbersDiv = document.getElementById('pageNumbers');
        pageNumbersDiv.innerHTML = '';
        
        const maxVisiblePages = 5;
        let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
        let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);
        
        if (endPage - startPage + 1 < maxVisiblePages) {
            startPage = Math.max(1, endPage - maxVisiblePages + 1);
        }
        
        for (let i = startPage; i <= endPage; i++) {
            const pageBtn = document.createElement('button');
            pageBtn.textContent = i;
            pageBtn.className = i === currentPage ? 'btn btn-primary' : 'btn btn-outline';
            pageBtn.style.cssText = 'padding:8px 12px; border:1px solid #ddd; background:' + (i === currentPage ? '#007bff; color:white' : 'white') + '; border-radius:6px; cursor:pointer;';
            pageBtn.addEventListener('click', () => {
                currentPage = i;
                renderPage();
            });
            pageNumbersDiv.appendChild(pageBtn);
        }
    }
</script>
</body>
</html>
