<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Teacher</title>
    <link rel="stylesheet" th:href="@{/style.css}" />
</head>
<body>
<div class="app-container">
    <aside class="sidebar">
        <div class="sidebar-header">📚 Talim CRM</div>
        <nav class="sidebar-nav">
            <a class="nav-link" th:href="@{/v1/auth/reception}"><span>Reception</span></a>
            <a class="nav-link" th:href="@{/v1/student/listPage}"><span>Students</span></a>
            <a class="nav-link" th:href="@{/v1/student/register}"><span>New student</span></a>
            <a class="nav-link" th:href="@{/v1/group/listPage}"><span>Groups</span></a>
            <a class="nav-link" th:href="@{/v1/group/register}"><span>New group</span></a>
            <a class="nav-link" th:href="@{/v1/teacher/listPage}"><span>Teachers</span></a>
            <a class="nav-link" th:href="@{/v1/teacher/register}"><span>New teacher</span></a>
            <a class="nav-link" th:href="@{/v1/pay/listPage}"><span>Payments</span></a>
            <a class="nav-link" th:href="@{/v1/pay/statsPage}"><span>Stats</span></a>
        </nav>
    </aside>
    <main class="main-content">
<div class="container">

    <h1>Create Teacher</h1>

    <form id="teacherRegisterForm" style="max-width:520px;">
        <div style="margin-bottom:12px;">
            <label>Full name *</label>
            <input type="text" id="fullName" style="width:100%; padding:10px 14px; border:1px solid #ddd; border-radius:8px;" placeholder="Full name" required>
        </div>
        <div style="margin-bottom:12px;">
            <label>Phone *</label>
            <input type="tel" id="phoneNum" style="width:100%; padding:10px 14px; border:1px solid #ddd; border-radius:8px;" placeholder="+998 xx xxx xx xx" required>
        </div>
        <div style="margin-bottom:12px;">
            <label>Knowledge level</label>
            <input type="text" id="levelOfKnowledge" style="width:100%; padding:10px 14px; border:1px solid #ddd; border-radius:8px;" placeholder="e.g. B2, IELTS 7.0">
        </div>
        <div class="actions">
            <button type="submit" class="btn">Create</button>
            <a th:href="@{/v1/teacher/listPage}" class="btn" style="background:#e0e0e0; color:#333;">Cancel</a>
        </div>
    </form>
</div>
    </main>
</div>

<script>
    const API = '/v1/teacher';
    document.getElementById('teacherRegisterForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
            fullName: document.getElementById('fullName').value.trim(),
            phoneNum: document.getElementById('phoneNum').value.trim(),
            levelOfKnowledge: document.getElementById('levelOfKnowledge').value.trim()
        };
        const res = await fetch(`${API}/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        if (res.ok) {
            window.location.href = '/v1/teacher/listPage';
        } else {
            alert('Failed to create teacher');
        }
    });
</script>
</body>
</html>
